<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael Bird Photography</title>
    <link href="mebcss.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Jost:wght@400&family=Spectral:wght@400&display=swap"
        rel="stylesheet">
    <script data-goatcounter="https://michaelbird.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>

<body data-page-title="Contact">
    <div id="site-header"></div>
    <div id="site-nav"></div>

    <main class="container py-4" style="max-width: 720px;">
        <h1>Contact</h1>
        <p class="lead">
            Got a question about a print, a licensing request, or just want to
            talk bugs and light? Reach out — I read every message.
        </p>
        <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" id="contact-form"
            class="mt-4">
            <input type="hidden" name="form-name" value="contact">
            <p class="d-none">
                <label>Don't fill this out if you're human: <input name="bot-field"></label>
            </p>
            <div class="mb-3">
                <label for="contact-name" class="form-label">Name</label>
                <input type="text" class="form-control" id="contact-name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="contact-email" class="form-label">Email</label>
                <input type="email" class="form-control" id="contact-email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="contact-phone" class="form-label">Phone</label>
                <input type="tel" class="form-control" id="contact-phone" name="phone">
            </div>
            <div class="mb-3">
                <label for="contact-message" class="form-label">Message</label>
                <textarea class="form-control" id="contact-message" name="message" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-outline-dark">Send</button>
        </form>
        <p class="mt-3 mb-0 d-none" id="contact-form-success">Thanks — I'll get back to you soon.</p>

    </main>

    <div id="site-footer"></div>

    <script src="mebshared.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="//widget.fotomoto.com/stores/script/1c66d998b2549532f9d8e669fa04b52240d7d31e.js"></script>
    <noscript>If Javascript is disabled in your browser, to place orders please visit the page where I <a href="https://my.fotomoto.com/store/1c66d998b2549532f9d8e669fa04b52240d7d31e">sell my photos</a>, powered by <a href="https://my.fotomoto.com/">Fotomoto</a>.</noscript>
</body>

</html>
